dataset_ids:
  - ds003838
dataset_id: ds003838

paths:
  raw_root: ./data/raw
  out_root: ./derivatives/smoke_ds003838

# 5-subject smoke cohort: 3 rest + 2 memory (one observation per subject).
subjects:
  - sub-033
  - sub-036
  - sub-038
  - sub-039
  - sub-041
subject_tasks:
  sub-033: rest
  sub-036: rest
  sub-038: rest
  sub-039: memory
  sub-041: memory
tasks:
  - rest
  - memory
# ds003838 sets condition_label equal to task_label.
conditions:
  - rest
  - memory
# ds003838 uses a single session label for all recordings.
sessions:
  - single

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  start_time_s: 10.0
  end_time_s: 120.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
  save_heatmap: true
  show_heatmap: true
