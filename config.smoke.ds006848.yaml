dataset_ids:
  - ds006848
dataset_id: ds006848

paths:
  raw_root: ./data/raw
  out_root: ./derivatives/smoke_ds006848

subjects:
  - sub-001
tasks:
  - rest
conditions: []
sessions: []

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  start_time_s: 20.0
  end_time_s: 180.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 3
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
