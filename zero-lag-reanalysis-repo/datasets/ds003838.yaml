# Confirmatory zero-lag analysis — ds003838 full cohort (rest + memory).
schema_version: 1
dataset_id: ds003838
role: primary

paths:
  raw_root: ../../data/raw/ds003838
  output_subdir: primary/ds003838

selection:
  subjects: []
  tasks:
    - rest
    - memory
  conditions:
    - rest
    - memory
  sessions:
    - single

protocol:
  participant_id_from: subject_id
  session_id_from: session_label
  cardiac_event_type: r_peak

normalization:
  condition_semantics:
    rest: { state: state_low, time: time_na, session: single }
    memory: { state: state_high, time: time_na, session: single }

capabilities:
  has_eeg: true
  has_hr: true
  cardiac_modality: ecg
  has_ecg_r_peaks: true
  has_ppg_peaks: false
  has_low_high_task_pair: true
  has_pre_post_pair: false
  has_behavior: false
  supports_d180: true
  supports_d240: true
  supports_topography: true
  supports_gamma: true
  sensitivity_only: false
  has_artifact_controls: true
