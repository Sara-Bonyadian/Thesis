# Confirmatory zero-lag analysis — ds004587 (ig + rest).
# Scientific role: single-condition dedicated-ECG external-generalization cohort.
# Rest and IG remain available for lag-zero replication; do not force a paired
# rest–task contrast into the primary state-dependent meta-analysis.
schema_version: 1
dataset_id: ds004587
role: sensitivity

paths:
  # Wrapper clone is data/raw/ds004587/; BIDS subjects live in the nested
  # dataset folder (symlink to the external OpenNeuro annex checkout).
  raw_root: ../../data/raw/ds004587/ds004587
  output_subdir: sensitivity/ds004587

selection:
  subjects: []
  tasks: []
  conditions: []
  sessions: []

protocol:
  participant_id_from: observation_id
  session_id_from: session_label
  cardiac_event_type: r_peak

normalization:
  condition_semantics:
    rest: { state: state_low, time: time_na, session: single }
    ig: { state: state_other, time: time_na, session: single }

capabilities:
  has_eeg: true
  has_hr: true
  cardiac_modality: ecg
  has_ecg_r_peaks: true
  has_ppg_peaks: false
  has_low_high_task_pair: false
  has_pre_post_pair: false
  has_behavior: false
  supports_d180: true
  supports_d240: true
  supports_topography: true
  supports_gamma: true
  sensitivity_only: true
  has_artifact_controls: true
