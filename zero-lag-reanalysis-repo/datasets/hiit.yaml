# Confirmatory zero-lag analysis — HIIT full cohort (4 tasks × 2 modalities).
schema_version: 1
dataset_id: hiit
role: sensitivity

paths:
  raw_root: ../../data/raw/HIIT
  output_subdir: sensitivity/hiit

selection:
  subjects: []
  tasks:
    - rest
    - tetris
  conditions:
    - ph_pre_rest
    - ph_pre_tetris
    - ph_post_rest
    - ph_post_tetris
    - ps_pre_rest
    - ps_pre_tetris
    - ps_post_rest
    - ps_post_tetris
  sessions:
    - ph
    - ps

eeg:
  sampling_rate_hz: 500
  line_frequency_hz: 60

cardiac:
  channel: photosensor
  signal_type: ppg
  detector: ppg_peak
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1500.0
