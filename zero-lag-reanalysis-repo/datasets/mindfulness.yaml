# Confirmatory zero-lag analysis — Mindfulness full cohort.
schema_version: 1
dataset_id: mindfulness
role: sensitivity

paths:
  raw_root: ../../data/raw/Mindfulness project
  output_subdir: sensitivity/mindfulness

selection:
  subjects: []
  tasks: []
  conditions: []
  sessions: []

protocol:
  participant_id_from: observation_id
  session_id_from: session_label
  cardiac_event_type: systolic_peak

normalization:
  condition_semantics:
    step1: { state: state_low, time: time_na, session: part1 }
    step2: { state: state_high, time: time_na, session: part1 }
    step3: { state: state_high, time: time_na, session: part1 }

capabilities:
  has_eeg: true
  has_hr: true
  cardiac_modality: ppg
  has_ecg_r_peaks: false
  has_ppg_peaks: true
  has_low_high_task_pair: true
  has_pre_post_pair: false
  has_behavior: true
  supports_d180: true
  supports_d240: true
  supports_topography: true
  supports_gamma: true
  sensitivity_only: true
  has_artifact_controls: true
