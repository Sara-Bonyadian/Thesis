# Confirmatory M13b smoke — HIIT small paired subset (PPG / photosensor primary).
#
# Pairing (protocol_task labels; PH/PS never collapsed):
#   PRE:  {ph|ps}_pre_rest  ↔ {ph|ps}_pre_tetris
#   POST: {ph|ps}_post_rest ↔ {ph|ps}_post_tetris
# Keys: participant_id × session_id (ph|ps) × timepoint (embedded in condition).
#
# Primary cardiac modality for this smoke: PPG via embedded channel "photosensor"
# (see companion m13b.hiit.smoke.verification.json and Stage-1b exploratory config).
# Stop if photosensor cannot be selected, pairing incomplete, or D240/D180 support
# cannot be verified — never treat missing data as participant exclusion.
#
# Selected subset: participants 01–03 × sessions ph + ps (verify on-disk before run).
schema_version: 1
dataset_id: hiit
role: sensitivity

paths:
  raw_root: ../data/raw/HIIT
  output_subdir: smoke/hiit_m13b

selection:
  subjects:
    - "01"
    - "02"
    - "03"
  tasks:
    - rest
    - tetris
  conditions:
    # PRE rest ↔ PRE Tetris (within ph and within ps)
    - ph_pre_rest
    - ph_pre_tetris
    - ps_pre_rest
    - ps_pre_tetris
    # POST rest ↔ POST Tetris (within ph and within ps)
    - ph_post_rest
    - ph_post_tetris
    - ps_post_rest
    - ps_post_tetris
  sessions:
    - ph
    - ps
