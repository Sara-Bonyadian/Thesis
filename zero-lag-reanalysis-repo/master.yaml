schema_version: 1

confirmatory:
  # Confirmatory derivatives must never share a root with exploratory runs.
  output_root: ../derivatives/confirmatory_temporal_coupling
  root_seed: 20260713
  # Null battery: DEFAULT_N_SURROGATES=500 in code for production. Smoke YAML
  # files set n_surrogates: 20 for fast CI / M13 checks.
  # Contract note: 500 ≠ prior 1000 (p resolution 1/501 vs 1/1001; seeds unchanged).
  #
  # Robustness design (finalized; Methods-facing):
  #   Default confirmatory robustness:
  #     - C4 temporal surrogate nulls (circular shift, phase randomization,
  #       block shuffle, cross-subject mismatch, AR(1) innovations)
  #     - C6 broadband EEG residualization
  #     - C6 duration sensitivity (D180 ZLPI; D120 MWPI; D60 SWPI)
  #   Optional dataset-conditional artifact controls (CLI only; not a YAML key):
  #     --optional-artifact-controls enables CFA/QRS, motion/EOG/EMG, respiration,
  #     mean HR, beat count/density, eye state when required signals are present.
  #   Cardiac modality: each dataset selects one primary ECG or PPG channel for
  #   instantaneous HR in dataset YAML / PROTOCOL_SPECS (no dual-modality tables).

  bands:
    theta: [4, 7]
    alpha: [8, 12]
    beta: [13, 29]
    low_gamma: [30, 45]

  durations:
    all_s: [240, 180, 120, 60]
    primary_s: 240

  # Duration-specific lag grids (common-support M5). Do not override in dataset YAML.
  lag:
    step_s: 1
    by_duration:
      240: {min_s: -60, max_s: 60}   # standard ZLPI input
      180: {min_s: -60, max_s: 60}   # standard ZLPI input
      120: {min_s: -30, max_s: 30}   # MWPI sensitivity only
      60:  {min_s: -20, max_s: 20}   # SWPI sensitivity only

  # Named endpoint contracts (computed in M6). D120/D60 are never pooled with ZLPI.
  endpoints:
    shoulders_s: [5, 15]
    peak_center_equivalence_s: 2
    by_duration:
      240:
        name: zlpi
        flanks_s: [20, 60]
        is_standard_zlpi: true
        pool_with_standard_zlpi: true
      180:
        name: zlpi
        flanks_s: [20, 60]
        is_standard_zlpi: true
        pool_with_standard_zlpi: true
      120:
        name: mid_window_proximal_index   # MWPI; not ZLPI
        flanks_s: [20, 30]
        is_standard_zlpi: false
        pool_with_standard_zlpi: false
      60:
        name: short_window_proximal_index # SWPI; not ZLPI
        flanks_s: [10, 20]
        is_standard_zlpi: false
        pool_with_standard_zlpi: false

  cardiac:
    hr_mode: instantaneous

  dataset_roles:
    primary:
      - ds003838
      - ds006848
      - ds003690
      - ds004587
    sensitivity:
      - ds004582
      - ds003816
      - hiit
      - mindfulness
