# HIIT confirmatory smoke (M13b) — PPG / photosensor primary.
# Pairing: PRE rest↔Tetris and POST rest↔Tetris within each PH/PS session.
# Companion: verification.json (stop rules). Beat detection runs in confirmatory C1b.
schema_version: 1
dataset_id: hiit
role: sensitivity

# Smoke null battery; production default is 500 (DEFAULT_N_SURROGATES).
n_surrogates: 20

paths:
  raw_root: ../../../data/raw/HIIT
  output_subdir: smoke/hiit_m13b

selection:
  subjects:
    - "01"
    - "02"
    - "03"
  tasks:
    - rest
    - tetris
  conditions:
    - ph_pre_rest
    - ph_pre_tetris
    - ps_pre_rest
    - ps_pre_tetris
    - ph_post_rest
    - ph_post_tetris
    - ps_post_rest
    - ps_post_tetris
  sessions:
    - ph
    - ps

eeg:
  sampling_rate_hz: 500
  line_frequency_hz: 60

cardiac:
  channel: photosensor
  signal_type: ppg
  detector: ppg_peak
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1500.0
  debug_plot: false
