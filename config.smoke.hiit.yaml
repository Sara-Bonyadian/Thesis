dataset_ids:
  - hiit
dataset_id: hiit

paths:
  raw_root: ./data/raw
  out_root: ./derivatives/smoke_hiit

subjects:
  - "01"
tasks:
  - rest
conditions: []
sessions: []

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  start_time_s: 30.0
  end_time_s: 120.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true
  reuse_eeg_features_csv: false
  reuse_ppg_features_csv: false

correlation:
  alpha: 0.05
  min_n: 3
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_observation_index: true
  save_summary_json: true
  eeg_base_csv_mode: base_only
  eeg_base_csv_new_file_name: features_base_eeg_power_extended.csv
