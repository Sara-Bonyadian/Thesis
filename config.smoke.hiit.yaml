dataset_ids:
  - hiit
dataset_id: hiit

paths:
  raw_root: ./data/raw
  out_root: ./derivatives/smoke_hiit

# 5-subject smoke cohort: one observation per subject, each from a random HIIT condition.
subjects:
  - "01"
  - "02"
  - "03"
  - "04"
  - "05"
# Fixed random draw (seed=42) from the 8 HIIT condition labels below.
subject_conditions:
  "01": ph_pre_tetris
  "02": ph_pre_rest
  "03": ps_pre_tetris
  "04": ph_post_rest
  "05": ps_post_tetris
tasks:
  - rest
  - tetris
# HIIT condition_label = {modality}_{timepoint}_{state}.
conditions:
  - ph_pre_rest
  - ph_pre_tetris
  - ph_post_rest
  - ph_post_tetris
  - ps_pre_rest
  - ps_pre_tetris
  - ps_post_rest
  - ps_post_tetris
# HIIT session_label = modality (ph = photosensor, ps = pressure sensor).
sessions:
  - ph
  - ps

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  start_time_s: 30.0
  end_time_s: 120.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
  save_heatmap: true
  show_heatmap: true
