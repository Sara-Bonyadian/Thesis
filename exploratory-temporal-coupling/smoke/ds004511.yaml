# Smoke config for temporal EEG–cardiac coupling (ds004511 rest).
# 3-subject cohort before running exploratory-temporal-coupling/datasets/ds004511.yaml on full raw data.
# See temporal_coupling/README.md and exploratory-temporal-coupling/smoke/ds003838.yaml.

dataset_id: ds004511

paths:
  raw_root: ./data/raw/ds004511
  out_root: ./derivatives/smoke_ds004511_temporal_coupling
  base_root: ./derivatives/smoke_ds004511_fast

# Subject IDs match BIDS entity after "sub-" (e.g. sub-S210317 → S210317).
subjects:
  - S200116
  - S210317
  - S201210

tasks:
  - rest

conditions:
  - rest

sessions:
  - "01"

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average

ppg:
  # null = use full EEG/ECG overlap
  start_time_s: null
  end_time_s: null
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1500.0

temporal_coupling:
  audit:
    min_overlap_s: 10
    min_clean_beats: 30

  eeg:
    bands:
      theta: [4.0, 8.0]
      alpha: [8.0, 13.0]
      beta: [13.0, 30.0]
    envelope_smooth_s: 2.0
    envelope_output_fs_hz: 10
    rois:
      theta: [Fz, F1, F2, FCz, FC1, FC2, Cz]
      alpha: [Pz, P3, P4, POz, PO3, PO4, Oz, O1, O2]
      beta: [Fz, F1, F2, FCz, FC1, FC2, Cz, C3, C4]
    debug_plot:
      enabled: true
      start_time_s: 40
      end_time_s: 60
      auto_window_s: 20
      also_auto_window: true
      save_psd: true
      # ds004511 EDF uses numeric channel labels (1–128), not 10–5 names.
      channels:
        theta: "64"
        alpha: "1"
        beta: "64"

  cardiac:
    channel: auto
    signal_type: ecg
    detector: auto
    ecg:
      bandpass_hz: [5, 30]
      min_peak_distance_s: 0.45
      prominence: auto
      height: auto
      test_inverted: true
    hr_window_s: 15.0
    mean_rr_window_s: 15.0
    hrv_window_s: 60.0
    hrv_step_s: 2.0
    min_beats_hr: 5
    min_beats_hrv: 20
    min_valid_hr_percent: 50.0
    min_valid_hrv_percent: 30.0
    debug_plot:
      enabled: true
      windows:
        - [35, 45]
        - [50, 60]
        - [65, 75]
      auto_window_s: 10
      overview_window_s: 40
      save_overview: true
      also_auto_window: true
      max_plots_per_subject: 5

  resample:
    fs_hz: 1.0
    z_score: true
    interpolate_max_gap_s: 5

  cross_correlation:
    lag_max_s: 60
    lag_step_s: 5
    n_permutations: 0
    detrend: false
    rolling_detrend_window_s: null
    edge_margin_s: 0
    min_peak_distance_s: 10
    peak_prominence: auto
    peak_height: auto
    peak_selection: abs_peak

  events:
    enabled: false
    hr_percentile: 10
    eeg_threshold_sd: 2.0
    epoch_pre_s: 60
    epoch_post_s: 60
    min_event_distance_s: 10
    min_total_events: 10
    min_contributing_subjects: 4
    theta_burst_method: percentile
    theta_burst_percentile: 90
    alpha_suppression_method: percentile
    alpha_suppression_percentile: 10
    beta_burst_method: percentile
    beta_burst_percentile: 90

  output:
    save_curves: true
    save_plots: true

  group:
    plot_common_lag_only: true
