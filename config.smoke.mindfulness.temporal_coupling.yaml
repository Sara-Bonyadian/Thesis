# Smoke config for temporal EEG–cardiac coupling (Mindfulness project).
# 7-subject cohort (mbd folders) before a full-cohort run config.
# ECG is embedded in BrainVision EEG files; cardiac HR/HRV from photosensor (PPG peak detection).

dataset_id: mindfulness

paths:
  raw_root: ./data/raw/Mindfulness project
  out_root: ./derivatives/smoke_mindfulness_temporal_coupling
  base_root: ./derivatives/smoke_mindfulness_fast

subjects:
  - mbd-01
  - mbd-04
  - mbd-05
  - mbd-06
  - mbd-07
  - mbd-08
  - mbd-09

tasks:
  - step1

conditions:
  - step1

sessions:
  - part1

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average

ppg:
  start_time_s: null
  end_time_s: null
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1500.0

temporal_coupling:
  audit:
    min_overlap_s: 60
    min_clean_beats: 30

  eeg:
    bands:
      theta: [4.0, 8.0]
      alpha: [8.0, 13.0]
      beta: [13.0, 30.0]
    envelope_smooth_s: 2.0
    envelope_output_fs_hz: 10
    rois:
      theta: [Fz, FCz, Cz]
      alpha: [Pz, Oz, O1, O2]
      beta: [Fz, FCz, Cz, C3, C4]
    debug_plot:
      enabled: false

  cardiac:
    # Embedded photosensor PPG in BrainVision files (not ecg).
    channel: photosensor
    signal_type: ppg
    detector: ppg_peak
    ecg:
      bandpass_hz: [5, 30]
      min_peak_distance_s: 0.45
      prominence: auto
      height: auto
      test_inverted: true
    hr_window_s: 15.0
    mean_rr_window_s: 15.0
    hrv_window_s: 60.0
    hrv_step_s: 2.0
    min_beats_hr: 5
    min_beats_hrv: 20
    min_valid_hr_percent: 50.0
    min_valid_hrv_percent: 30.0
    debug_plot:
      enabled: false

  resample:
    fs_hz: 1.0
    z_score: true
    interpolate_max_gap_s: 5

  cross_correlation:
    lag_max_s: 60
    lag_step_s: 5
    n_permutations: 0
    detrend: false
    rolling_detrend_window_s: null
    edge_margin_s: 0
    min_peak_distance_s: 10
    peak_prominence: auto
    peak_height: auto
    peak_selection: abs_peak

  events:
    enabled: false

  output:
    save_curves: true
    save_plots: true

  group:
    plot_common_lag_only: true
    n_group_permutations: 0
