# M13b companion — exploratory Stage 0/1b prerequisites for confirmatory HIIT smoke.
# Same participant/session subset as config.confirmatory.smoke.hiit.yaml.
# Forces PPG via embedded photosensor (do not use ECG for this smoke).
#
# After this succeeds, feed detected_peaks.csv into confirmatory M2 instant-HR.
#
# Run (one stage at a time; see operator runbook):
#   python -m ppg_eeg.temporal_coupling --config config.smoke.hiit.m13b.temporal_coupling.yaml --stage 0
#   python -m ppg_eeg.temporal_coupling --config config.smoke.hiit.m13b.temporal_coupling.yaml --stage 1b

dataset_id: hiit
# Confirmatory pairing uses protocol_task labels; keep discovery aligned.
hiit_partition_mode: protocol_task

paths:
  raw_root: ./data/raw/HIIT
  out_root: ./derivatives/smoke_hiit_m13b_temporal_coupling
  base_root: ./derivatives/smoke_hiit_m13b_temporal_coupling

subjects:
  - "01"
  - "02"
  - "03"

tasks:
  - rest
  - tetris

conditions:
  - ph_pre_rest
  - ph_pre_tetris
  - ph_post_rest
  - ph_post_tetris
  - ps_pre_rest
  - ps_pre_tetris
  - ps_post_rest
  - ps_post_tetris

sessions:
  - ph
  - ps

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average

ppg:
  start_time_s: null
  end_time_s: null
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1500.0

temporal_coupling:
  audit:
    # Smoke gate aligned with D180 nested support; D240 checked in confirmatory eligibility.
    min_overlap_s: 180
    min_clean_beats: 30

  eeg:
    bands:
      theta: [4.0, 8.0]
      alpha: [8.0, 13.0]
      beta: [13.0, 30.0]
    envelope_smooth_s: 2.0
    envelope_output_fs_hz: 10
    rois:
      theta: [Fz, F1, F2, FCz, FC1, FC2, Cz]
      alpha: [Pz, P3, P4, POz, PO3, PO4, Oz, O1, O2]
      beta: [Fz, F1, F2, FCz, FC1, FC2, Cz, C3, C4]
    debug_plot:
      enabled: false

  cardiac:
    channel: photosensor
    signal_type: ppg
    detector: ppg_peak
    ecg:
      bandpass_hz: [5, 30]
      min_peak_distance_s: 0.45
      prominence: auto
      height: auto
      test_inverted: true
    hr_window_s: 15.0
    mean_rr_window_s: 15.0
    hrv_window_s: 60.0
    hrv_step_s: 2.0
    min_beats_hr: 5
    min_beats_hrv: 20
    min_valid_hr_percent: 50.0
    min_valid_hrv_percent: 30.0
    debug_plot:
      enabled: true

  resample:
    fs_hz: 1.0
    z_score: true
    interpolate_max_gap_s: 5

  cross_correlation:
    lag_max_s: 60
    lag_step_s: 5
    n_permutations: 20
    detrend: false
    rolling_detrend_window_s: null
    edge_margin_s: 0
    min_peak_distance_s: 10
    peak_prominence: auto
    peak_height: auto

  events:
    enabled: false

  output:
    save_curves: true
    save_plots: true

  group:
    plot_common_lag_only: true
    n_group_permutations: 20
