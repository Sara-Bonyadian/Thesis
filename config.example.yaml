dataset_ids:
  - hiit
  - ds003838
  - ds006848

# Backward-compatible single-dataset selector (optional).
dataset_id: hiit

paths:
  # raw_root can point either to ./data/raw or directly to one dataset folder.
  raw_root: ./data/raw
  out_root: ./derivatives

# Optional global filters across adapters.
subjects: []
tasks: []
conditions: []
sessions: []

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  # If this range is out of bounds for a recording, the pipeline falls back
  # to the full recording duration.
  start_time_s: 175.0
  end_time_s: 235.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400
  ibi_max_ms: 1200

features:
  eeg:
    # Optional base power-only correlation set. The pipeline still writes the
    # channel-level master EEG CSV with power_* and *_power_uv2 columns.
    # - power_theta
    # - power_alpha
    # - power_beta
    # Higher-level EEG features are derived from channel-level band powers.
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true
  # If true, load prior EEG features from out_root/<dataset_id>/.
  # The loader checks features_core_eeg.csv, then the configured extended EEG file,
  # then features_base_eeg_power.csv. A channel-level base CSV can be used to derive
  # eeg_fm_theta, eeg_frontal_beta, eeg_faa, eeg_global_alpha_db, and eeg_global_beta_db.
  reuse_eeg_features_csv: false
  # Optional: also reuse prior PPG features from CSV to avoid raw file loading.
  reuse_ppg_features_csv: false

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_observation_index: true
  save_summary_json: true
  # How to write features_base_eeg_power.csv:
  # - base_only: write the channel-level master EEG power schema
  # - append_columns: merge newly computed EEG feature columns into existing base CSV
  # - new_file: keep base CSV unchanged and write extra columns to eeg_base_csv_new_file_name
  eeg_base_csv_mode: base_only
  eeg_base_csv_new_file_name: features_base_eeg_power_extended.csv
