dataset_ids:
  - hiit
  - ds003838
  - ds006848

# Backward-compatible single-dataset selector (optional).
dataset_id: hiit

paths:
  # raw_root can point either to ./data/raw or directly to one dataset folder.
  raw_root: ./data/raw
  out_root: ./derivatives

# Optional global filters across adapters.
# Limit to 6 subjects per dataset (IDs differ by dataset; each adapter keeps only its matches).
# ds003838 subjects avoid sub-032/sub-034/sub-035 because those IDs also exist in ds006848.
subjects:
  # HIIT (2-digit IDs)
  - "01"
  - "02"
  - "03"
  - "04"
  - "05"
  - "06"
  # ds003838
  - sub-033
  - sub-036
  - sub-038
  - sub-039
  - sub-040
  - sub-041
  # ds006848
  - sub-001
  - sub-002
  - sub-003
  - sub-004
  - sub-005
  - sub-006
# Task filter: rest for HIIT + ds003838; verbalwm for ds006848 (most subjects lack rest).
tasks:
  - rest
  - verbalwm
# HIIT uses composite condition labels; OpenNeuro uses the task name as condition_label.
conditions:
  - rest
  - verbalwm
  - ph_pre_rest
# HIIT session = modality (ph); OpenNeuro datasets use session_label=single.
sessions:
  - ph
  - single

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 2048

ppg:
  # If this range is out of bounds for a recording, the pipeline falls back
  # to the full recording duration.
  start_time_s: 175.0
  end_time_s: 235.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400
  ibi_max_ms: 1200

features:
  eeg:
    # Optional base power-only correlation set. The pipeline still writes the
    # channel-level master EEG CSV with power_* and *_power_uv2 columns.
    # - theta_power_uv2
    # - alpha_power_uv2
    # - beta_power_uv2
    # Higher-level EEG features are derived from channel-level band powers.
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
