dataset_ids:
  - hiit
dataset_id: hiit

paths:
  raw_root: ./data/raw/HIIT
  out_root: ./derivatives/run_hiit_fast

# Empty lists = all subjects / observations for this dataset.
subjects: []
tasks:
  - rest
  - tetris
# HIIT condition_label = {modality}_{timepoint}_{state}.
conditions:
  - ph_pre_rest
  - ph_pre_tetris
  - ph_post_rest
  - ph_post_tetris
  - ps_pre_rest
  - ps_pre_tetris
  - ps_post_rest
  - ps_post_tetris
# HIIT session_label = modality (ph = photosensor, ps = pressure sensor).
sessions:
  - ph
  - ps

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 512

ppg:
  start_time_s: 175.0
  end_time_s: 235.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
  save_heatmap: true
  show_heatmap: true
