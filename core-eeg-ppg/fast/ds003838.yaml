dataset_ids:
  - ds003838
dataset_id: ds003838

paths:
  raw_root: ./data/raw/ds003838
  out_root: ./derivatives/run_ds003838_fast

# Empty lists = all subjects / observations for this dataset.
subjects: []
# ds003838 sets condition_label equal to task_label.
tasks:
  - rest
  - memory
conditions:
  - rest
  - memory
# ds003838 uses a single session label for all recordings.
sessions:
  - single

eeg:
  l_freq: 1.0
  h_freq: 60.0
  bad_channel_variance_z: 3.0
  reference: average
  psd:
    fmin: 1.0
    fmax: 60.0
    n_fft: 512

ppg:
  start_time_s: 175.0
  end_time_s: 235.0
  peak_min_distance_s: 0.4
  peak_height: 0.3
  ibi_min_ms: 400.0
  ibi_max_ms: 1200.0

features:
  eeg:
    - eeg_fm_theta
    - eeg_frontal_beta
    - eeg_faa
    - eeg_global_alpha_db
    - eeg_global_beta_db
  ppg:
    - ppg_mean_hr_bpm
    - ppg_rmssd_ms
    - ppg_sdnn_ms
    - ppg_mean_rr_ms
    - ppg_peak_hr_bpm
  include_robust_z: true

correlation:
  alpha: 0.05
  min_n: 5
  methods:
    - auto
  primary_method: auto
  fdr_method: fdr_bh

output:
  save_summary_json: true
  save_heatmap: true
  show_heatmap: true
